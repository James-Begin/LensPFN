name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lens
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check --config pyproject.toml src scripts tests ../scripts
      - run: uv run --no-sync ruff format --config pyproject.toml --check src scripts tests ../scripts
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv run --no-sync python scripts/prepare_demo.py --root .lens-feed-ci
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test lens/tests/test_*.cjs
      - run: for file in lens/extension/*.js; do node --check "$file"; done
      - run: python scripts/package_extension.py
      - run: git diff --exit-code -- demo/lens-extension.zip
      - run: python scripts/check_submission.py
